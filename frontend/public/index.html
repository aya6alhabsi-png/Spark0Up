<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <meta
      name="description"
      content="SparkUp - Smart innovation platform for Oman"
    />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>SparkUp</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <!-- Prevent React development overlay from showing harmless Chatbase script errors -->
    <script>
      window.addEventListener(
        "error",
        function (event) {
          if (event && event.message === "Script error.") {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        },
        true
      );

      window.addEventListener(
        "unhandledrejection",
        function (event) {
          if (event && String(event.reason || "").includes("chatbase")) {
            event.preventDefault();
          }
        },
        true
      );
    </script>

    <!-- Chatbase SparkUp Support Chatbot -->
    <script>
      (function () {
        if (
          !window.chatbase ||
          window.chatbase("getState") !== "initialized"
        ) {
          window.chatbase = (...args) => {
            if (!window.chatbase.q) {
              window.chatbase.q = [];
            }

            window.chatbase.q.push(args);
          };

          window.chatbase = new Proxy(window.chatbase, {
            get(target, prop) {
              if (prop === "q") {
                return target.q;
              }

              return (...args) => target(prop, ...args);
            },
          });
        }

        const onLoad = function () {
          if (document.getElementById("DyjnxcXAWonX8nakeFib1")) return;

          const script = document.createElement("script");

          script.src = "https://www.chatbase.co/embed.min.js";

          script.id = "DyjnxcXAWonX8nakeFib1";

          script.setAttribute(
            "chatbotId",
            "DyjnxcXAWonX8nakeFib1"
          );

          script.setAttribute("domain", "www.chatbase.co");

          script.defer = true;

          document.body.appendChild(script);
        };

        if (document.readyState === "complete") {
          onLoad();
        } else {
          window.addEventListener("load", onLoad);
        }
      })();
    </script>
  </body>
</html>
